<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevSuite - Module Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Control Bar */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
    }

    .brand span {
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background-color: var(--accent-primary);
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.875rem;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    /* Fullscreen Application Container */
    .app-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      background-color: #000;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Header -->
  <header>
    <a href="freetime.html" class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
      <span id="module-title-display">DevSuite Module Player</span>
    </a>
    
    <div class="nav-controls">
      <button class="btn btn-secondary" onclick="reloadModule()">🔄 Reload</button>
      <button class="btn btn-secondary" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <a href="freetime.html" class="btn">← Back to Workspace</a>
    </div>
  </header>

  <!-- Module Embed Iframe -->
  <div class="app-container" id="player-wrapper">
    <iframe id="module-frame" allow="autoplay; gamepad; clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
  </div>

  <script>
    // Extract parameters from URL
    const params = new URLSearchParams(window.location.search);
    const moduleUrl = params.get('url');
    const moduleTitle = params.get('title');

    if (moduleTitle) {
      document.getElementById('module-title-display').textContent = decodeURIComponent(moduleTitle);
      document.title = `${decodeURIComponent(moduleTitle)} - DevSuite`;
    }

    if (moduleUrl) {
      document.getElementById('module-frame').src = decodeURIComponent(moduleUrl);
    } else {
      document.getElementById('module-frame').src = 'https://play2048.co/';
    }

    function reloadModule() {
      const frame = document.getElementById('module-frame');
      frame.src = frame.src;
    }

    function toggleFullscreen() {
      const elem = document.getElementById('player-wrapper');
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
